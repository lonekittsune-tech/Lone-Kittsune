<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Drift – Tokyo / Initial D Style Racer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <!-- HUD (visible during race) -->
    <div id="hud" class="hidden">
      <div>LAP: <span id="lap">1</span>/<span id="maxLaps">3</span></div>
      <div>TIME: <span id="time">0.00</span>s</div>
      <div>BEST: <span id="best">--</span>s</div>
      <div>SPEED: <span id="speed">0</span> km/h</div>
      <div>NITRO: <span id="nitro">100</span>%</div>
      <div id="position">POS: 1st</div>
    </div>

    <!-- Main Menu -->
    <div id="menu">
      <h1>MIDNIGHT DRIFT</h1>
      <p class="subtitle">Tokyo • Initial D • MF Ghost Style</p>

      <div class="section">
        <h2>SELECT CAR</h2>
        <div id="carSelect" class="options"></div>
      </div>

      <div class="section">
        <h2>SELECT TRACK</h2>
        <div id="trackSelect" class="options"></div>
      </div>

      <button id="startBtn">START RACE</button>
      <p class="hint">WASD / Arrows = Drive &nbsp;|&nbsp; SPACE = Drift &nbsp;|&nbsp; SHIFT = Nitro &nbsp;|&nbsp; R = Restart</p>
    </div>

    <!-- Race messages -->
    <div id="message" class="hidden"></div>

    <div id="controls" class="hidden">
      WASD / Arrows – Drive &nbsp;|&nbsp; SPACE – Drift &nbsp;|&nbsp; SHIFT – Nitro &nbsp;|&nbsp; R – Restart
    </div>
  </div>

  <canvas id="game"></canvas>
  <script src="game.js"></script>
</body>
</html>
